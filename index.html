<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="ad.size" content="width=300,height=250">
<title>MPI Bird Flu Owner Response - 300x250 (Chicken)</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 300px;
    height: 250px;
    overflow: hidden;
  }
  .banner {
    position: relative;
    width: 300px;
    height: 250px;
    cursor: pointer;
  }
  .frame {
    position: absolute;
    top: 0;
    left: 0;
    width: 300px;
    height: 250px;
    opacity: 0;
    transition: opacity 1s ease-in-out;
  }
  .frame.active {
    opacity: 1;
  }
  .frame img.bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 300px;
    height: 250px;
    display: block;
  }
  .el {
    position: absolute;
    display: block;
    opacity: 0;
    transition: opacity 1s ease-in-out;
  }
  .static-el {
    position: absolute;
    display: block;
    opacity: 1;
  }

  /* --- element placement --- */
  .bird      { left: 159px;   top: 107px;    width: 170.5px;  height: 171.6px; }
  .headline  { left: 12.72px; top: 27.42px;  width: 218.76px; height: 86.27px; transform-origin: left center; }
  .text2     { left: 15.66px; top: 73.61px;  width: 186.9px;  height: 78.83px; }
  .text3     { left: 15.36px; top: 73.97px;  width: 230.94px; height: 83.03px; }
  .step1     { left: 53.4px;  top: 40.62px;  width: 153.42px; height: 48.54px; }
  .step2     { left: 53.4px;  top: 100.43px; width: 193.2px;  height: 48.18px; }
  .step3     { left: 53.4px;  top: 159.83px; width: 145.14px; height: 48.6px; }
  .card      { left: 89.04px; top: 51.3px;   width: 121.92px; height: 122.87px; }
  .cta       { left: 96.37px; top: 177.59px; width: 107.26px; height: 18.81px; }
  .govtnz    { left: 222.78px; top: 212.02px; width: 62.22px; height: 22.74px; }

  /* --- keyframes ---
     transform only: opacity is handled separately below by a plain transition, so
     fade-in/out is always reliable regardless of whether an entrance animation is
     running (an animation being removed does not reliably hand off to a transition). */
  @keyframes riseUp {
    from { transform: translateY(450px); }
    to   { transform: translateY(0); }
  }
  @keyframes fadeRiseIn {
    from { transform: translateY(20px); }
    to   { transform: translateY(0); }
  }
  @keyframes expandIn {
    from { transform: scale(0); }
    to   { transform: scale(1); }
  }

  /* --- per-frame entrance timing --- */

  /* frame 1: bird rises from beneath the frame and lands first; headline only
     starts growing from nothing once the bird has settled into place */
  .frame.active .bird {
    opacity: 1;
    transition: opacity 1.6s ease-in-out;
    animation: riseUp 1.6s cubic-bezier(.4,0,.2,1);
  }
  .frame.active .headline {
    opacity: 1;
    transition: opacity 1.1s ease-in-out 1.75s;
    animation: expandIn 1.1s ease-out 1.75s;
  }

  /* frames 2-3 text: no element-level animation - plain fade in/out via the frame's own opacity transition */

  /* frame 4: three steps come in one at a time. Step 1 fades/rises in first.
     Steps 2 and 3 appear immediately (riding the frame's own fade-in) already
     at 20% opacity, then each is bumped to full opacity in turn via a JS-toggled
     "revealed" class - see the script below for the stagger timing. */
  .frame.active .step1 {
    opacity: 1;
    transition: opacity 0.7s ease-in-out 0.1s;
    animation: fadeRiseIn 0.7s ease-out 0.1s;
  }
  .frame.active .step2,
  .frame.active .step3 {
    opacity: 0.2;
    transition: none;
  }
  .frame.active .step2.revealed,
  .frame.active .step3.revealed {
    opacity: 1;
    transition: opacity 1s ease-in-out;
  }

  /* frame 5 (end card): the bird flu logo fades/rises in first and lingers on its own,
     then the CTA and GOVT.NZ logo come in together well after (matches the other banners' sequencing) */
  .frame.active .card {
    opacity: 1;
    transition: opacity 0.8s ease-in-out 0.15s;
    animation: fadeRiseIn 0.8s ease-out 0.15s;
  }
  .frame.active .cta,
  .frame.active .govtnz {
    opacity: 1;
    transition: opacity 0.7s ease-in-out 1.8s;
    animation: fadeRiseIn 0.7s ease-out 1.8s;
  }

  .clickthrough {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
  }
</style>
</head>
<body>
  <div class="banner" id="banner">

    <div class="frame" id="frame1">
      <img class="bg" src="images/bg-frame1.jpg" alt="">
      <img class="el bird" src="images/chicken.webp" alt="">
      <img class="el headline" src="images/el-frame1_headline.png" alt="Don't let bird flu take flight">
    </div>

    <div class="frame" id="frame2">
      <img class="bg" src="images/bg-feather.jpg" alt="">
      <img class="static-el text2" src="images/el-frame2_text.png" alt="Bird flu has been detected in New Zealand">
    </div>

    <div class="frame" id="frame3">
      <img class="bg" src="images/bg-feather.jpg" alt="">
      <img class="static-el text3" src="images/el-frame3_text.png" alt="Take steps now to protect your poultry and pet birds">
    </div>

    <div class="frame" id="frame4">
      <img class="bg" src="images/bg-feather.jpg" alt="">
      <img class="el step1" id="step1" src="images/el-frame4_step1.png" alt="Watch">
      <img class="el step2" id="step2" src="images/el-frame4_step2.png" alt="Separate">
      <img class="el step3" id="step3" src="images/el-frame4_step3.png" alt="Scrub">
    </div>

    <div class="frame" id="frame5">
      <img class="bg" src="images/bg-feather.jpg" alt="">
      <img class="el card" src="images/el-endcard_bubble.png" alt="Bird flu, know what to do">
      <img class="el cta" src="images/el-endcard_cta.png" alt="Find out more">
      <img class="el govtnz" src="images/govtnz-lockup.png" alt="GOVT.NZ">
    </div>

    <a class="clickthrough" id="clickthrough" href="#REPLACE_CLICK_URL" target="_blank" rel="noopener"></a>
  </div>

  <script>
    // Ad-server clickTag convention. Replace with the real destination URL before trafficking.
    var clickTag = "#REPLACE_CLICK_URL";
    document.getElementById("clickthrough").addEventListener("click", function (e) {
      e.preventDefault();
      window.open(clickTag, "_blank");
    });

    var frames = [
      document.getElementById("frame1"),
      document.getElementById("frame2"),
      document.getElementById("frame3"),
      document.getElementById("frame4"),
      document.getElementById("frame5")
    ];
    var step2 = document.getElementById("step2");
    var step3 = document.getElementById("step3");
    var stepTimers = [];

    var durations = [6000, 4000, 4500, 7200, 5000]; // ms each frame is shown
    var maxLoops = 2; // full sequence repeats, then holds on the end card
    var index = 0;
    var loopCount = 0;

    function clearStepTimers() {
      stepTimers.forEach(clearTimeout);
      stepTimers = [];
      step2.classList.remove("revealed");
      step3.classList.remove("revealed");
    }

    function showFrame(i) {
      frames.forEach(function (f, idx) {
        f.classList.toggle("active", idx === i);
      });

      clearStepTimers();
      if (i === 3) {
        // frame 4: reveal step 2, then step 3, in turn
        stepTimers.push(setTimeout(function () { step2.classList.add("revealed"); }, 1500));
        stepTimers.push(setTimeout(function () { step3.classList.add("revealed"); }, 3000));
      }
    }

    function advance() {
      var next = index + 1;

      if (next >= frames.length) {
        loopCount++;
        if (loopCount >= maxLoops) {
          // Stay on the end card (last frame) permanently.
          return;
        }
        next = 0;
      }

      index = next;
      showFrame(index);
      setTimeout(advance, durations[index]);
    }

    // Frame 1 starts out inactive (opacity 0, per .frame's base style) so that
    // activating it here is a genuine state change - required for its entrance
    // transition/animation to actually play. A double rAF lets the browser paint
    // the inactive state first; without it, the very first activation can get
    // coalesced with the initial render and the entrance skips straight to its
    // end state.
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        showFrame(0);
        setTimeout(advance, durations[0]);
      });
    });
  </script>
</body>
</html>
